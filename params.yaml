# Parámetros del proyecto. DVC los rastrea: cambiar un valor invalida las etapas que dependen de él.
seed: 42

data:
  # Los CSV del taller (copias fijadas a un commit de Nir-J/ML-Projects). Ver docs/sources.json.
  train_csv: data/raw/UNSW_NB15_training-set.csv
  test_csv: data/raw/UNSW_NB15_testing-set.csv
  expected_train_rows: 175341
  expected_test_rows: 82332
  expected_train_sha256: bec7dd5ec88dc2a0ccc7a07879d338395ed7421750f675fd0339e07dfe0648fa
  # Columnas que NO son entradas: id (orden del archivo), label (respuesta), attack_cat (respuesta relacionada = fuga)
  drop_cols: [id, attack_cat]
  target: label
  categorical: [proto, service, state]

split:
  # Validación = 1 de 5 pliegues, agrupando por patrón de entradas idénticas (hash de las 42 variables)
  # para que un mismo vector de entrada nunca quede en entrenamiento y validación a la vez.
  n_splits: 5

selection:
  # Regla de umbral DECLARADA ANTES de ver resultados:
  # entre los umbrales con tasa de falsos positivos (FPR) en validación <= max_fpr, elegir el de mayor recall.
  max_fpr: 0.05
  # El modelo se elige por macro-F1 en validación (con su umbral ya optimizado por la regla anterior).
  model_metric: macro_f1_at_threshold

mlflow:
  tracking_uri: sqlite:///mlflow.db
  experiment: defiende-el-servidor
  registered_model: unsw-nb15-detector
